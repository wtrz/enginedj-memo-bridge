[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enginedj-memo-bridge"
version = "0.1.3"
description = "EngineDJ to DDJMMAN memo sync for Denon-compatible MP3 ID3 tags"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EngineDJ Memo Bridge contributors"}]
dependencies = [
  "PySide6>=6.8",
  "mutagen>=1.47",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
]

[project.scripts]
enginedj-memo-bridge = "enginedj_memo_bridge.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

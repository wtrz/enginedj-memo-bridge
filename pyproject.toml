[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-dns3700-sync"
version = "0.1.0"
description = "Manual GUI sync from Engine DJ database data to DN-S3700-compatible ID3 tags"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Engine DN-S3700 Sync contributors"}]
dependencies = [
  "PySide6>=6.8",
  "mutagen>=1.47",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
]

[project.scripts]
engine-dns3700-sync = "engine_dns3700_sync.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
